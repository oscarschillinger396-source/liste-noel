  if (taille && !/guide|choisir|sélectionner|tableau/i.test(taille[1])) r.taille = taille[1].trim();
  return r;
}

// On a collé quelque chose : un lien, ou toute une page
function recevoirCollage(texte){
  const champ = $("#g-lien"), info = $("#g-info-lien");
  if (!champ) return;
  if (estUnLien(texte)){ champ.value = texte.trim(); remplirDepuisLien(); return; }
  const r = lireTextePage(texte);
  if (r.lien && !champ.value.trim()){ champ.value = r.lien; dernierLienLu = r.lien; }
  const adresse = lireAdresse(champ.value.trim());
  r.couleur = r.couleur || adresse.couleur;
  r.taille = r.taille || adresse.taille;
  // Le nom écrit dans le lien est plus fiable que celui deviné dans le texte de la page
  r.nom = adresse.nom || r.nom;
  const trouve = [];
  if (r.nom && mettreAuto("g-nom", nomEssentiel(r.nom))) trouve.push("le nom");
  if (r.prix && mettreAuto("g-prix", (Number.isInteger(r.prix) ? String(r.prix) : r.prix.toFixed(2)).replace(".", ","))){ $("#g-estime").checked = false; trouve.push("le prix"); }
  const ajouts = [];
  if (r.taille){ ajouts.push("Taille " + (/^[a-z]{1,4}$/i.test(r.taille) ? r.taille.toUpperCase() : r.taille)); trouve.push("la taille"); }
  if (r.couleur){ ajouts.push("Couleur " + r.couleur); trouve.push("la couleur"); }
  if (ajouts.length) mettreAuto("g-precisions", ajouts.join(", "));
  const et = l => l.join(", ").replace(/, ([^,]*)$/, " et $1");
  info.textContent = trouve.length
    ? "✅ J'ai trouvé " + et(trouve) + " dans la page. Vérifie, puis clique sur « Ajouter »." + (champ.value.trim() ? "" : " Pense à coller aussi le lien du produit.")
    : "Je n'ai rien trouvé dans ce texte. Colle le lien du produit, ou écris le nom et le prix à la main.";
}


// Le nom du cadeau, juste l'essentiel : sans la couleur, sans la description après la virgule.
// « Veste de ski et snowboard chaude et imperméable homme, 100 noir » → « Veste de ski et snowboard chaude et imperméable homme »
const COULEURS_NOM = COULEURS.replace(/\|or\|/, "|") + "|dorée|argenté|argentée|écru|anthracite|camel|blanc cassé|bleu marine|bleu nuit";
// Un morceau du nom, sans ce qui ne sert à rien pour reconnaître le cadeau
function nettoyerMorceauNom(m){
  return m.replace(new RegExp("\\b(" + COULEURS_NOM + ")(\\s+(et|/)\\s+(" + COULEURS_NOM + "))*\\b", "gi"), " ")
    // Les détails techniques : « (version 2024) », « 7 kg », « 128 Go », « 1400 W », « 32 cm », les références « WW70FG3M05AWEF »
    .replace(/\([^)]*\)?|\[[^\]]*\]?/g, " ")
    .replace(/\b\d+([.,]\d+)?\s?(kg|g|go|to|mo|w|v|mah|cm|mm|m|l|ml|cl|pouces?|"|trs?\/min|hz|ghz|mp|%)(?![a-zà-ÿ])/gi, " ")
    .replace(/(?<![\w-])(?=[a-z0-9]*\d)(?=[a-z0-9]*[a-z])[a-z0-9]{7,}(?![\w-])/gi, " ")
    // Les mots de pub : « sans fil », « Bluetooth », « officielle », « édition »… et tout ce qui vient après « pour » ou « compatible »
    .replace(/\b(sans[ -]fils?|wireless|bluetooth|filaire|officiel(le)?|original(e)?|nouveaux?|nouvelles?|neuve?s?|[ée]dition|version|haute pr[ée]cision|premium|carbone)\b/gi, " ")
    .replace(/\b(à |a )?(r[ée]duction (active )?de bruit|anti-?bruit|noise cancelling)\b.*$/i, " ")
    .replace(/\b(pour|compatibles?|for|avec)\b.*$/i, " ")
    .replace(/\bcontroller\b/gi, "Manette")
    .replace(/\b(homme|femme|mixte|unisexe|adulte|gar[çc]on|fille)s?\b/gi, " ")
    .replace(/\s+/g, " ").replace(/^[\s,/&+-]+|[\s,/&+-]+$/g, "").trim();
}
function nomEssentiel(nom){
  let n = String(nom || "").replace(/\s+/g, " ").trim();
  // Le nom est découpé là où les boutiques ajoutent des détails (« - », « – », « | », « , », « + »).
  // On garde les premiers morceaux jusqu'à avoir au moins 3 vrais mots :
  // « Xbox Manette sans Fil - Elite Series 2 – Core (Blanc) Series X… » → « Xbox Manette » + « Elite Series 2 »
  const morceaux = n.split(/\s*[–|:]\s*|\s-\s|,\s|\s\+\s/).map(nettoyerMorceauNom).filter(Boolean);
  if (morceaux.length){
    let debut = morceaux[0], i = 1;
    while (debut.split(" ").length < 3 && i < morceaux.length) debut += " " + morceaux[i++];
    n = debut;
  }
  // La manette PS5 : « Playstation Sony Manette 5 DualSense » → « Manette PS5 DualSense »
  if (/dualsense/i.test(n)) n = "Manette PS5 DualSense" + (/\bedge\b/i.test(n) ? " Edge" : "");
  // Le type d'objet devant : « Xbox Manette Elite Series 2 », « SCUF Valor Pro Manette » → « Manette … »
  const objet = n.match(/\s(manette|casque|console|clavier|souris|enceinte)\b(?! \d)/i);
  if (objet) n = objet[1].charAt(0).toUpperCase() + objet[1].slice(1).toLowerCase() + " " + n.replace(objet[0], "").trim();
  // Un nom tout en MAJUSCULES : on le remet en minuscules
  // (mais « EA SPORTS FC 27 » reste comme ça : c'est une marque)
  if (n === n.toUpperCase() && n.split(" ").filter(m => /^[A-ZÀ-Ý]{4,}$/.test(m)).length >= 2) n = n.toLowerCase();
  // 5 mots au plus, sans finir sur un petit mot (« de », « et », « pour »…)
  let mots = n.split(" ");
  if (mots.length > 5) mots = mots.slice(0, 5);
  while (mots.length > 2 && /^(de|du|des|et|pour|avec|à|a|en|le|la|les|l'|d'|sans|sur|au|aux|-|\/|&)$/i.test(mots[mots.length - 1])) mots.pop();
  n = mots.join(" ");
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : String(nom || "").trim();
}

// Ce que le site a rempli tout seul : si on change de lien, on peut le remplacer sans toucher à ce que tu as écrit toi-même
let autoRempli = {};
function mettreAuto(id, valeur){
  const e = $("#" + id); if (!e) return false;
  const actuel = e.value.trim();
  if (actuel && actuel !== String(autoRempli[id] ?? "")) return false; // tu l'as écrit toi-même : on n'y touche pas
  e.value = valeur; autoRempli[id] = e.value.trim();
  return true;
}

// Quand on colle un lien : le serveur lit la page du produit, et on remplit les cases encore vides
let dernierLienLu = "";
async function remplirDepuisLien(){
  const champ = $("#g-lien"), info = $("#g-info-lien");
  if (!champ || !info) return;
  const lienP = champ.value.trim();
  if (!safeUrl(lienP) || lienP === dernierLienLu) return;
  dernierLienLu = lienP;
  // Nouveau lien : ce qui avait été rempli tout seul pour l'ancien lien est effacé (pas ce que tu as écrit toi-même)
  for (const [id, v] of Object.entries(autoRempli)){ const e = $("#" + id); if (e && e.value.trim() === v) e.value = ""; }
  autoRempli = {};
  info.textContent = "🔎 Je cherche le prix, la taille et la couleur…";
  let r = {};
  try{ r = await api("apercu", {method: "POST", body: {lien: lienP}, auth: true}); }
  catch(e){ if (e.status === 401) { info.textContent = e.message; return; } }
  if ($("#g-lien") !== champ || champ.value.trim() !== lienP) return; // le formulaire a changé entre-temps
  // Ce que la page n'a pas donné, on le cherche dans l'adresse
  const adresse = lireAdresse(lienP);
  r.nom = nomUtile(r.nom, lienP) || adresse.nom;
  r.couleur = r.couleur || adresse.couleur;
  r.taille = r.taille || adresse.taille;
  const trouve = [];
  if (r.nom) r.nom = nomEssentiel(r.nom);
  if (r.taille && /^[a-z]{1,4}$/i.test(r.taille)) r.taille = r.taille.toUpperCase();
  if (r.nom && mettreAuto("g-nom", r.nom)) trouve.push("le nom");
  if (r.prix && mettreAuto("g-prix", r.prix)){ $("#g-estime").checked = false; trouve.push("le prix"); }
  const prec = $("#g-precisions"), ajouts = [];
  if (r.taille){ ajouts.push("Taille " + r.taille); trouve.push("la taille"); }
  if (r.couleur){ ajouts.push("Couleur " + r.couleur); trouve.push("la couleur"); }
  if (ajouts.length && !mettreAuto("g-precisions", ajouts.join(", "))){
    // Tu avais déjà écrit des précisions : on ajoute seulement ce qui manque
    const manquants = ajouts.filter(a => !new RegExp("^" + a.split(" ")[0], "i").test(prec.value) && !prec.value.toLowerCase().includes(a.split(" ")[0].toLowerCase()));
    if (manquants.length) prec.value = [...manquants, prec.value.trim()].filter(Boolean).join(", ");
  }
  const manque = [];
  if (!r.prix && !$("#g-prix").value) manque.push("le prix");
  // La taille n'existe pas pour tous les cadeaux (une lampe, un Lego…) : on le rappelle seulement pour les vêtements et chaussures
  if (!r.taille && !/taille|pointure/i.test(prec.value) && /sweat|veste|pull|pantalon|jean|chaussure|basket|sneaker|t shirt|tee|robe|manteau|blouson|combinaison|gant|maillot|short|jogg/i.test(r.nom || "")) manque.push("la taille");
  const et = l => l.join(", ").replace(/, ([^,]*)$/, " et $1");
  info.textContent = (trouve.length ? "✅ J'ai rempli " + et(trouve) + ". " : "")
    + (r.bloque && !r.prix ? "🔒 Ce site bloque la lecture automatique : écris le prix à la main (ou fais « Tout sélectionner » puis « Copier » sur la page du produit, et colle ici)."
      : manque.length === 2 ? "✍️ Ce site ne donne ni le prix ni la taille : écris-les à la main."
      : manque.length ? "✍️ Ce site ne donne pas " + manque[0] + " : écris-" + (manque[0] === "la taille" ? "la" : "le") + " à la main."
      : "Vérifie, puis clique sur le bouton.");
}

// Choisir le fond de la page et le style de la liste ; tout le monde verra la liste avec ces thèmes
function choixThemes(autre){
  const t = liste.theme || {fond: "sapin", liste: "course"};
  const box = el("div", "carte themes"); box.style.maxWidth = "none";
  box.append(el("h2", null, autre ? "🎨 Ses thèmes" : "🎨 Mes thèmes"));
  const rangee = (titre, choix, cle, apercu) => {
    box.append(el("h3", null, titre));
    const p = el("div", "pastilles"); p.setAttribute("role", "group"); p.setAttribute("aria-label", titre);
    Object.entries(choix).forEach(([id, info]) => {
      const b = bouton("pastille", null, () => changerTheme({...t, [cle]: id}));
      b.setAttribute("aria-pressed", t[cle] === id);
      const rond = el("span", "rond"); rond.style.background = apercu(info);
      b.append(rond, info.nom);
      p.append(b);
    });
    box.append(p);
  };
  rangee("Fond de la page", FONDS, "fond", i => "linear-gradient(160deg," + i.couleurs[0] + "," + i.couleurs[1] + ")");
  rangee("Style de la liste", STYLES_LISTE, "liste", i => i.apercu);
  // Les décorations : une scène dessinée derrière la page
  box.append(el("h3", null, "Décorations"));
  const pd = el("div", "pastilles");
  Object.entries(DECOS).forEach(([id, info]) => {
    const b = bouton("pastille deco-choix", null, () => changerTheme({...t, deco: id}));
    b.setAttribute("aria-pressed", (t.deco || "aucune") === id);
    b.append(el("span", "rond", info.icone), info.nom); pd.append(b);
  });
  box.append(pd);
  // La couleur du prénom : une pastille avec l'initiale, dans la couleur
  box.append(el("h3", null, "Couleur du prénom"));
  const pp = el("div", "pastilles");
  Object.entries(PSEUDOS).forEach(([id, info]) => {
    const b = bouton("pastille pseudo-choix", null, () => changerTheme({...t, pseudo: id}));
    b.setAttribute("aria-pressed", (t.pseudo || "neige") === id);
    const rond = el("span", "rond", (liste.prenom || "?").charAt(0).toUpperCase()); rond.style.color = info.clair;
    rond.style.textShadow = t.neon ? "0 0 8px " + info.clair : "none";
    b.append(rond, info.nom); pp.append(b);
  });
  box.append(pp);
  // Les options qu'on allume ou pas
  box.append(el("h3", null, "Options"));
  const op = el("div", "options");
  const option = (cle, texte) => {
    const b = bouton("option", null, () => changerTheme({...t, [cle]: !t[cle]}));
    b.setAttribute("aria-pressed", !!t[cle]);
    b.append(el("span", "inter"), texte); op.append(b);
  };
  option("neon", "✨ Effets néon");
  option("sombre", "🌙 Mode sombre");
  box.append(op);
  // Quand les néons sont allumés : leur couleur à eux (indépendante de la couleur du prénom)
  if (t.neon){
    box.append(el("h3", null, "Couleur des néons"));
    const pn = el("div", "pastilles");
    Object.entries(NEONS).forEach(([id, info]) => {
      const b = bouton("pastille neon-choix", null, () => changerTheme({...t, neonCouleur: id}));
      b.setAttribute("aria-pressed", (t.neonCouleur || "rose") === id);
      const rond = el("span", "rond");
      rond.style.background = "radial-gradient(circle at 50% 50%, #0b0616 38%, transparent 40%), conic-gradient(" + info.c.concat(info.c[0]).join(",") + ")";
      rond.style.boxShadow = "0 0 12px " + info.c[0] + ", 0 0 20px " + info.c[1];
      b.append(rond, info.nom); pn.append(b);
    });
    box.append(pn);
  }
  if (msg.theme) box.append(el("p", msg.err ? "alerte" : "aide", msg.theme));
  return box;
}

async function changerTheme(theme){
  const avant = liste.theme;
  liste.theme = theme; msg = {}; render(); // on montre tout de suite le nouveau thème
  try{
    const r = await api("listes/" + cible + "/theme", {method: "PUT", body: theme, auth: true});
    liste.theme = r.theme;
    if (cible === session.profil.id) ecrireSession({...session, profil: {...session.profil, theme: r.theme}});
    msg = {theme: "Thème enregistré !"};
  }catch(e){
    if (!session){ location.hash = "connexion"; return; }
    liste.theme = avant;
    msg = {theme: e.status ? e.message : "Le site n'arrive pas à joindre son serveur.", err: true};
  }
  render();
}

// Enregistre toute la liste ; renvoie un message d'erreur, ou rien si c'est bon
async function sauver(cadeaux, texte){
  try{
    const r = await api("listes/" + cible + "/cadeaux", {method: "PUT", body: {cadeaux}, auth: true});
    liste.cadeaux = r.cadeaux; edition = null; aSupprimer = null; msg = {texte};
    render();
  }catch(e){
    if (!session){ location.hash = "connexion"; return; }
    const texteErreur = e.status ? e.message : "Le site n'arrive pas à joindre son serveur. Réessaie dans un instant.";
    msg = {texte: texteErreur};
    return texteErreur;
  }
}

/* ---------- Neige ---------- */
function neige(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#snow"), ctx = cv.getContext("2d");
  let w, h, flocons = [];
  function taille(){
    w = cv.width = innerWidth; h = cv.height = innerHeight;
    const n = Math.round(Math.min(140, w * h / 8000));
    flocons = Array.from({length:n}, () => ({x:Math.random()*w, y:Math.random()*h, r:.8+Math.random()*2.6, v:.35+Math.random()*1.1, d:Math.random()*6.3}));
  }
  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const f of flocons){
      f.y += f.v; f.d += .012; f.x += Math.sin(f.d) * .45;
      if (f.y > h + 5){ f.y = -5; f.x = Math.random() * w; }
      ctx.fillStyle = "rgba(247,244,238," + (.35 + f.r / 5) + ")";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", taille);
  taille(); frame();
}
