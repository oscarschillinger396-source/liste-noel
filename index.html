<!doctype html>
<html lang="fr">
<head>
<title>Noël en famille</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : une nuit de course sous la neige. En haut, le compte (invité ou connecté) ; puis le panneau chrono ; puis les listes de la fratrie, ou une liste en grille de départ (P1, P2…). */
:root{
  --night:#0a231c;      /* fond : sapin de nuit */
  --night-2:#123a2f;    /* halo du haut */
  --panel:#0f2f26;      /* panneau chrono */
  --line:#24584a;       /* filets */
  --snow:#f7f4ee;       /* texte principal, damier */
  --frost:#a9c7bb;      /* texte secondaire */
  --red:#e0313f;        /* rouge Noël / drapeau */
  --red-dark:#9b1522;   /* ombre du bouton */
  --gold:#f2c35b;       /* or, chrono, priorités */
  --display:"Racing Sans One", "Arial Black", Impact, sans-serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --label:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--snow);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--night) radial-gradient(120% 60% at 50% 0%, var(--night-2), var(--night) 70%) no-repeat;overflow-x:hidden}

/* Guirlande */
.lights{position:fixed;top:0;left:0;right:0;height:calc(38px + env(safe-area-inset-top, 0px));padding-top:env(safe-area-inset-top, 0px);
  display:flex;justify-content:space-around;pointer-events:none;z-index:4}
.lights::before{content:"";position:absolute;left:-2%;right:-2%;top:calc(env(safe-area-inset-top, 0px) + 4px);height:16px;
  border-bottom:2px solid #1d4a3d;border-radius:0 0 50% 50%/0 0 100% 100%}
.lights i{position:relative;top:14px;width:9px;height:14px;border-radius:45% 45% 50% 50%;background:var(--c);box-shadow:0 0 12px 3px var(--c)}
.lights i:nth-child(4n+1){--c:#ff4655}.lights i:nth-child(4n+2){--c:#ffd062}.lights i:nth-child(4n+3){--c:#62d4ff}.lights i:nth-child(4n){--c:#7bf08a}
@media (prefers-reduced-motion:no-preference){
  .lights i{animation:twinkle 1.8s ease-in-out infinite alternate}
  .lights i:nth-child(2n){animation-delay:.9s}.lights i:nth-child(3n){animation-delay:.45s}
}
@keyframes twinkle{to{opacity:.3;box-shadow:none}}

#snow{position:fixed;inset:0;pointer-events:none;z-index:1}

.wrap{position:relative;z-index:3;max-width:860px;margin:0 auto;padding-block:84px 56px;display:grid;gap:44px}

/* Damier */
.checker{height:18px;border-radius:3px;
  background:repeating-conic-gradient(var(--snow) 0 25%, var(--red) 0 50%) 0 0/18px 18px;
  opacity:.95}

/* En-tête */
header{display:grid;gap:22px}
.kicker{display:flex;align-items:center;gap:12px;font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.kicker::after{content:"";flex:1;height:1px;background:var(--line)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(54px,13vw,112px);line-height:.92;letter-spacing:-.01em;
  text-wrap:balance;transform:skewX(-6deg);transform-origin:left;color:var(--snow);text-shadow:4px 4px 0 var(--red)}
h1 .tree{display:inline-block;transform:skewX(6deg);font-size:.6em;vertical-align:.18em;text-shadow:none}
.lede{margin:0;max-width:58ch;color:var(--frost);font-size:18px}

/* Panneau chrono */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cell{padding:16px 18px;display:grid;gap:2px;min-width:0}
.cell + .cell{border-left:1px solid var(--line)}
.cell .k{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--frost)}
.cell .v{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.go .v{color:var(--red)}
@media (max-width:520px){
  .board{grid-template-columns:1fr 1fr}
  .cell.go{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .cell.go + .cell{border-left:0}
}

/* Barre de section */
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between}
.bar h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,44px);line-height:1;transform:skewX(-6deg)}
.bar p{margin:6px 0 0;color:var(--frost);font-size:15px}
.sort{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.sort button{font:600 15px var(--label);letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:var(--frost);
  border-radius:999px;padding:7px 16px;cursor:pointer}
.sort button[aria-pressed="true"]{background:var(--snow);color:var(--night)}

/* Grille de départ */
.grid{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:pos}
.slot{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:20px;
  background:var(--snow);color:var(--night);border-radius:12px;padding:18px 20px 18px 0;overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.35)}
.slot::before{content:"";position:absolute;inset:0 auto 0 0;width:76px;background:var(--band, var(--red))}
.pos{position:relative;display:grid;place-items:center;font-family:var(--display);font-size:34px;line-height:1;color:var(--snow);transform:skewX(-6deg);
  text-shadow:0 2px 0 rgba(0,0,0,.4)}

/* Thèmes de fond (toute la page) : chaque personne choisit le sien pour sa liste */
body[data-fond="polaire"]{--night:#0b1a33;--night-2:#1d3a66;--panel:#10264a;--line:#2a4a7a;--frost:#a9c3e6}
body[data-fond="bordeaux"]{--night:#2a0a10;--night-2:#5a1422;--panel:#3a0f17;--line:#6e2633;--frost:#e3b3ba}
body[data-fond="chocolat"]{--night:#24160f;--night-2:#4a2e1e;--panel:#33201a;--line:#5e3f2c;--frost:#d9bfa8}
body[data-fond="galaxie"]{--night:#140b2a;--night-2:#3a1f6b;--panel:#1e1240;--line:#3d2a73;--frost:#c3b3ea}
/* Thèmes de liste (la bande à gauche de chaque cadeau) */
body[data-liste="dore"], .liste-dore{--band:linear-gradient(180deg,#f7d57a,#c8952f)}
body[data-liste="sucre"], .liste-sucre{--band:repeating-linear-gradient(-45deg,#e0313f 0 12px,#fff 12px 24px)}
body[data-liste="glace"], .liste-glace{--band:linear-gradient(180deg,#7fd0ff,#2f7fd6)}
body[data-liste="foret"], .liste-foret{--band:linear-gradient(180deg,#2f8a5f,#165a3b)}
.liste-course{--band:var(--red)}
.pos small{display:block;font-family:var(--label);font-size:12px;letter-spacing:.2em;transform:none;opacity:.85}
.info{display:grid;gap:6px;min-width:0}
.info h3{margin:0;font-family:var(--label);font-weight:700;font-size:23px;line-height:1.15;letter-spacing:.01em;overflow-wrap:anywhere}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--label);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:5px;background:#e6efe9;color:#1d4a3d}
.note{margin:0;color:#4a6158;font-size:15px;max-width:60ch}
.prio{display:flex;align-items:center;gap:8px;font:600 13px var(--label);letter-spacing:.08em;text-transform:uppercase;color:#4a6158}
.leds{display:flex;gap:3px}
.leds span{width:16px;height:7px;border-radius:2px;background:#d6e0da}
.leds span.on:nth-child(1){background:#2fa35a}.leds span.on:nth-child(2){background:#e8a623}.leds span.on:nth-child(3){background:var(--red)}
.side{display:grid;gap:10px;justify-items:end;text-align:right}
.price{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.price .approx{font-family:var(--label);font-size:14px;letter-spacing:.06em;color:#4a6158;margin-right:3px}
.price.none{font-family:var(--label);font-size:15px;font-weight:600;color:#4a6158;letter-spacing:.04em}
.go-btn{display:inline-flex;align-items:center;gap:6px;font:700 14px var(--label);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;
  background:var(--night);color:var(--snow);padding:9px 14px;border-radius:8px;white-space:nowrap}
.go-btn:hover{background:var(--red)}
.go-btn .host{font-weight:500;letter-spacing:.02em;text-transform:none;opacity:.7}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

@media (max-width:620px){
  .slot{grid-template-columns:56px minmax(0,1fr);padding:16px 16px 16px 0;gap:14px 16px}
  .slot::before{width:56px}
  .pos{font-size:28px;grid-row:span 2;align-self:stretch}
  .side{grid-column:2;justify-items:start;text-align:left;grid-auto-flow:column;align-items:center;justify-content:space-between}
}
@media (prefers-reduced-motion:no-preference){
  .slot{transition:transform .18s ease}
  .slot:hover{transform:translateX(4px)}
}

/* Réservation */
.resa{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-top:6px}

/* Bouton « Je l'offre » : un paquet cadeau de course, penché, avec damier et ruban doré */
.resa-btn{position:relative;display:inline-flex;align-items:stretch;padding:0;border:0;cursor:pointer;background:none;
  transform:skewX(-10deg);border-radius:9px;filter:drop-shadow(0 5px 0 var(--red-dark)) drop-shadow(0 10px 16px rgba(224,49,63,.35))}
.resa-btn .flag{width:22px;border-radius:9px 0 0 9px;
  background:repeating-conic-gradient(var(--night) 0 25%, var(--snow) 0 50%) 0 0/11px 11px}
.resa-btn .face{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:11px 20px 11px 16px;
  border-radius:0 9px 9px 0;color:#fff;background:linear-gradient(180deg, #f2464f, var(--red) 55%, #c4202d)}
.resa-btn .face::before{content:"";position:absolute;top:0;bottom:0;left:52px;width:10px;background:linear-gradient(90deg,#d99c2b,var(--gold),#d99c2b);opacity:.95}
.resa-btn .face::after{content:"";position:absolute;inset:0 auto 0 -60%;width:45%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);transform:skewX(-20deg)}
.resa-btn .gift{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;font-size:22px;line-height:1;transform:skewX(10deg)}
.resa-btn .txt{position:relative;z-index:1;display:grid;text-align:left;transform:skewX(10deg);padding-left:14px}
.resa-btn .txt b{font:400 22px/1 var(--display);letter-spacing:.01em}
.resa-btn .txt small{font:600 12px/1.3 var(--label);letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.resa-btn:hover .face{background:linear-gradient(180deg, #ff5a62, #ea3442 55%, #cc2532)}
.resa-btn:active{transform:skewX(-10deg) translateY(4px);filter:drop-shadow(0 1px 0 var(--red-dark)) drop-shadow(0 4px 8px rgba(224,49,63,.3))}
.resa-btn[disabled]{cursor:progress}
.resa-btn[disabled] .face{background:repeating-linear-gradient(-45deg, var(--red) 0 12px, #c4202d 12px 24px) 0 0/34px 34px}
@media (prefers-reduced-motion:no-preference){
  .resa-btn{transition:transform .15s ease, filter .15s ease}
  .resa-btn:hover{transform:skewX(-10deg) translateY(-2px)}
  .resa-btn:hover .face::after{animation:shine .7s ease}
  .resa-btn:hover .gift{animation:wiggle .5s ease}
  .resa-btn[disabled] .face{animation:stripes .6s linear infinite}
}
@keyframes shine{to{left:130%}}
@keyframes wiggle{25%{transform:skewX(10deg) rotate(-12deg)}75%{transform:skewX(10deg) rotate(12deg)}}
@keyframes stripes{to{background-position:34px 0}}

/* Badge « Réservé » : panneau de stand vert */
.resa-ok{display:inline-flex;align-items:center;gap:10px;transform:skewX(-10deg);border-radius:9px;padding:9px 18px 9px 10px;
  background:linear-gradient(180deg,#38b866,#2a9a52);color:#fff;box-shadow:0 4px 0 #1f7a40}
.resa-ok .check{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;color:#2a9a52;font-weight:900;font-size:16px;transform:skewX(10deg)}
.resa-ok .txt{display:grid;transform:skewX(10deg)}
.resa-ok .txt b{font:400 20px/1 var(--display)}
.resa-ok .txt small{font:600 12px/1.3 var(--label);letter-spacing:.16em;text-transform:uppercase;opacity:.9}
@media (prefers-reduced-motion:no-preference){ .resa-ok.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)} }
@keyframes pop{from{transform:skewX(-10deg) scale(.6);opacity:0}}

/* Confettis à la réservation */
.confetti{position:absolute;left:60px;top:28px;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:5;
  animation:boom .9s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.resa-link{font:600 14px var(--label);letter-spacing:.04em;background:none;border:0;padding:4px 2px;color:#4a6158;text-decoration:underline;cursor:pointer}
.resa-msg{font-size:14px;color:#4a6158}
.resa-msg.err{color:#b3202d}
.slot.taken .info h3{color:#4a6158}
.slot.taken::after{content:"Réservé";position:absolute;right:-34px;top:16px;transform:rotate(35deg);background:#2fa35a;color:#fff;
  font:700 12px var(--label);letter-spacing:.16em;text-transform:uppercase;padding:3px 40px}
@media (max-width:620px){.slot.taken::after{display:none}}

.empty{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--frost)}
.empty strong{display:block;color:var(--snow);font-size:19px;margin-bottom:4px}

/* Arrivée */
footer{display:grid;gap:14px;text-align:center}
footer p{margin:0;font-family:var(--display);font-size:26px;transform:skewX(-6deg)}
footer small{color:var(--frost);font-size:14px}

/* Barre du haut : invité ou connecté */
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{font-family:var(--display);font-size:24px;color:var(--snow);text-decoration:none;transform:skewX(-6deg)}
.nav-droite{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.statut{font:600 14px var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--frost);padding:6px 12px;border:1px solid var(--line);border-radius:999px}
.statut b{color:var(--gold)}
.btn{font:700 15px var(--label);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  background:var(--gold);color:var(--night);border:0;border-radius:8px;padding:9px 16px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--snow);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--frost)}
.btn.deco{background:var(--red);color:#fff}
.btn.danger{background:transparent;color:#b3202d;box-shadow:inset 0 0 0 2px #e7b3b8}
.btn.small{font-size:13px;padding:7px 12px}
.btn[disabled]{opacity:.55;cursor:default}
.retour{font:600 15px var(--label);letter-spacing:.06em;color:var(--frost);text-decoration:none}
.retour:hover{color:var(--snow)}

/* Accueil : une carte par liste */
.profils{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.profil{position:relative;display:grid;gap:4px;padding:20px 20px 18px 34px;border-radius:12px;text-decoration:none;color:var(--night);background:var(--snow);
  box-shadow:0 10px 28px rgba(0,0,0,.35);overflow:hidden}
.profil::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:var(--band, repeating-conic-gradient(var(--night) 0 25%, var(--snow) 0 50%) 0 0/7px 7px)}

/* Choix des thèmes */
.themes{display:grid;gap:14px}
.themes h3{margin:0;font:600 14px var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--frost)}
.pastilles{display:flex;flex-wrap:wrap;gap:10px}
.pastille{display:grid;justify-items:center;gap:6px;cursor:pointer;border:0;background:none;color:var(--snow);font:600 13px var(--label);letter-spacing:.04em;padding:0;width:84px}
.pastille .rond{width:56px;height:56px;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.pastille[aria-pressed="true"] .rond{box-shadow:0 0 0 3px var(--gold), inset 0 0 0 2px rgba(255,255,255,.25)}
.pastille[aria-pressed="true"]{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){ .pastille .rond{transition:transform .15s ease} .pastille:hover .rond{transform:translateY(-2px)} body{transition:background-color .3s ease} }
.profil .nom{font-family:var(--display);font-size:32px;line-height:1.05;transform:skewX(-6deg);overflow-wrap:anywhere}
.profil .nb{font:600 14px var(--label);letter-spacing:.1em;text-transform:uppercase;color:#4a6158}
.profil .voir{font:700 14px var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-top:6px}
.profil.moi{background:linear-gradient(160deg,#fff7e2,var(--snow))}
@media (prefers-reduced-motion:no-preference){ .profil{transition:transform .15s ease} .profil:hover{transform:translateY(-3px)} }

/* Écran d'entrée : trois grands choix */
.choix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.choix{grid-template-columns:1fr}}
.choix-carte{display:grid;gap:8px;justify-items:start;text-align:left;cursor:pointer;border:0;border-radius:14px;padding:22px;
  font:inherit;color:var(--night);background:var(--snow);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.choix-carte:first-child{background:linear-gradient(160deg,#fff3cf,var(--gold));box-shadow:0 10px 28px rgba(0,0,0,.35), 0 0 0 3px var(--gold)}
.choix-i{font-size:34px;line-height:1}
.choix-t{font-family:var(--display);font-size:30px;line-height:1.05;transform:skewX(-6deg)}
.choix-d{font-size:16px;color:#3c524a}
@media (prefers-reduced-motion:no-preference){ .choix-carte{transition:transform .15s ease} .choix-carte:hover{transform:translateY(-3px)} }

/* Bouton magique */
.magique summary{cursor:pointer;list-style:none}
.magique summary::-webkit-details-marker{display:none}
.magique-titre{font-family:var(--display);font-size:24px;color:var(--gold);transform:skewX(-6deg);display:inline-block}
.magique summary::after{content:"  ▾ Voir comment";font:600 13px var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--frost)}
.magique[open] summary::after{content:"  ▴ Fermer"}
.magique-etapes{margin:0;padding-left:22px;display:grid;gap:10px;color:var(--snow)}
.magique-btn{cursor:grab;margin-left:6px}
.rang-magique{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:500 13px var(--body);letter-spacing:0;text-transform:none;color:var(--frost)}
.rang-magique .magique-btn{margin-left:0;font-size:13px}
.rang-lien{display:flex;gap:8px;align-items:stretch}
.rang-lien input{flex:1;min-width:0}
.rang-lien .effacer-lien{flex:none;text-transform:none;letter-spacing:.02em}
.copier-btn{font:700 13px var(--label);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:0;border-radius:8px;padding:7px 12px;
  background:#e6efe9;color:#1d4a3d;white-space:nowrap}
.copier-btn:hover{background:#d3e4da}

/* Outils admin */
.admin-box{display:grid;gap:12px;border:2px solid var(--gold);border-radius:14px;padding:16px 18px;background:rgba(242,195,91,.08)}
.admin-tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--snow)}
.admin-badge{font:700 13px var(--label);letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--night);border-radius:999px;padding:5px 11px}
.admin-form{display:grid;gap:10px;max-width:420px}

/* Connexion : on touche son prénom */
.noms{display:flex;flex-wrap:wrap;gap:10px}
.nom-btn{font-family:var(--display);font-size:24px;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;
  background:var(--snow);color:var(--night);transform:skewX(-6deg)}
.nom-btn[aria-pressed="true"]{background:var(--gold);box-shadow:0 0 0 3px var(--snow)}

/* Formulaires */
.carte{display:grid;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:560px;width:100%}

<div class="wrap">

<script src="cadeaux.js"></script>
<script>
const $ = s => document.querySelector(s);
const SEED = (typeof LISTE !== "undefined" && LISTE) || null; // l'ancienne liste d'Oscar, pour l'importer ou la montrer hors ligne
let session = lireSession();      // { token, profil: { id, prenom } } quand on est connecté
let invite = lireInvite();        // true quand on a choisi « Mode invité »
let vueApres = null;              // la liste demandée avant l'écran d'entrée (lien partagé)
let cible = null;                 // la liste qu'on modifie : la sienne, ou celle d'un autre pour l'admin
let ajoutEnAttente = null;        // un cadeau envoyé par le bouton magique, à mettre dans le formulaire
let adminAction = null;           // "code" ou "supprimer" : l'outil admin ouvert sur une liste
// Les admins peuvent modifier et supprimer toutes les listes (le serveur vérifie aussi)
const ADMINS = ["oscar"];
const estAdmin = () => !!(session && (session.profil.admin || ADMINS.includes(session.profil.id)));
let enLigne = null;               // le serveur Netlify répond-il ?
let vue = "accueil", vueId = null, listes = [], liste = null, chargement = false;
let enCours = null, aConfirmer = null, msg = {}, fete = null, erreurForm = "", edition = null, aSupprimer = null;

/* ---------- Petits outils ---------- */
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function euro(n){ return n.toLocaleString("fr-FR", {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2}) + " €"; }
function safeUrl(u){ try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; }catch{ return null; } }
function slug(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30); }
function de(prenom){ return (/^[aeiouyhéèêàâîôû]/i.test(prenom) ? "d'" : "de ") + prenom; }
// « oscar » → « Oscar », pour l'affichage
function joli(prenom){ const p = String(prenom || "").trim(); return p.charAt(0).toUpperCase() + p.slice(1); }
function joliListe(l){ return l ? {...l, prenom: joli(l.prenom)} : l; }
function lien(href, cls, texte){ const a = el("a", cls, texte); a.href = href; return a; }
function bouton(cls, texte, onclick){ const b = el("button", cls, texte); b.type = "button"; b.onclick = onclick; return b; }

function lireSession(){ try{ return JSON.parse(localStorage.getItem("session")) || null; }catch{ return null; } }
function lireInvite(){ try{ return localStorage.getItem("invite") === "1"; }catch{ return false; } }
function choisirInvite(oui){ invite = oui; try{ oui ? localStorage.setItem("invite", "1") : localStorage.removeItem("invite"); }catch{} }
function ecrireSession(s){ session = s; try{ s ? localStorage.setItem("session", JSON.stringify(s)) : localStorage.removeItem("session"); }catch{} }

async function api(chemin, options = {}){
  const headers = {"Content-Type": "application/json"};
  if (session) headers.Authorization = "Bearer " + session.token;
  const r = await fetch("/api/" + chemin, {method: options.method || "GET", headers, cache: "no-store",
    body: options.body ? JSON.stringify(options.body) : undefined});
  let data = null;
  try{ data = await r.json(); }catch{}
  if (!r.ok || !data){
    if (r.status === 401 && session && options.auth){ ecrireSession(null); }
    // Pas de réponse du serveur (site pas encore sur Netlify) : status 0
    const e = new Error(data && data.erreur || "Le serveur ne répond pas."); e.status = data ? r.status : 0; throw e;
  }
  return data;
}

/* ---------- Décompte jusqu'au 24 décembre ---------- */
function joursAvantNoel(){
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let xmas = new Date(now.getFullYear(), 11, 24);
  if (today > xmas) xmas = new Date(now.getFullYear() + 1, 11, 24);
  return { jours: Math.round((xmas - today) / 864e5), annee: xmas.getFullYear() };
}
function majDecompte(){
  const { jours, annee } = joursAvantNoel();
  $("#kicker").textContent = "Grand Prix de Noël " + annee;
  const d = $("#decompte"); if (d) d.textContent = jours === 0 ? "C'est Noël !" : "J-" + jours;
}
function cellule(cle, valeur, cls){
  const c = el("div", "cell" + (cls ? " " + cls : ""));
  c.append(el("span", "k", cle), el("span", "v", valeur));
  return c;
}
function tableau(cases){
  const b = $("#board"); b.innerHTML = "";
  const go = cellule("Départ dans", ""); go.classList.add("go"); go.querySelector(".v").id = "decompte"; b.append(go);
  cases.forEach(([k, v]) => b.append(cellule(k, v)));
  b.style.gridTemplateColumns = cases.length ? "" : "1fr";
  majDecompte();
}

/* ---------- Navigation (#accueil, #liste-oscar, #connexion, #inscription, #ma-liste) ---------- */
async function aller(){
  const h = location.hash.replace(/^#/, "");
  aConfirmer = null; msg = {}; erreurForm = ""; aSupprimer = null; adminAction = null;
  if (h.startsWith("liste-")){ vue = "liste"; vueId = h.slice(6); }
  else if (h.startsWith("modifier-") && estAdmin()){ vue = "ma-liste"; cible = h.slice(9); }
  else if (["connexion", "inscription", "ma-liste"].includes(h)){ vue = h; if (h === "ma-liste" && session) cible = session.profil.id; }
  else if (h === "invite"){ choisirInvite(true); location.hash = "accueil"; return; }
  else if (h.startsWith("ajout")){
    // On arrive du bouton magique : on garde les infos, puis on va dans « Ma liste » (après connexion si besoin)
    const infos = Object.fromEntries(new URLSearchParams(h.slice(h.indexOf("?") + 1)));
    try{ localStorage.setItem("ajout", JSON.stringify(infos)); }catch{}
    ajoutEnAttente = infos;
    location.hash = session ? "ma-liste" : "connexion";
    return;
  }
  else { vue = "accueil"; }
  // Pas connecté et pas encore entré en invité : on montre d'abord l'écran d'entrée
  if (!session && !invite && (vue === "accueil" || vue === "liste")){ vueApres = vue === "liste" ? h : null; vue = "bienvenue"; }
  if (vue === "ma-liste" && !session){ location.hash = "connexion"; return; }
  if ((vue === "connexion" || vue === "inscription") && session){ location.hash = "ma-liste"; return; }
  if (vue !== "ma-liste") edition = null;
  chargement = true; render();
  try{
    if (vue === "accueil" || vue === "connexion"){ listes = (await api("listes")).map(joliListe); enLigne = true; }
    if (vue === "liste"){
      if (vueId === "demo") liste = demo();
      else { liste = joliListe(await api("listes/" + vueId)); enLigne = true; }
    }
    if (vue === "ma-liste"){ liste = joliListe(await api("listes/" + cible, {auth: true})); enLigne = true; }
  }catch(e){
    if (vue === "ma-liste" && !session){ location.hash = "connexion"; return; }
    liste = null;
    enLigne = e.status ? true : false;
  }
  chargement = false; render();
  scrollTo({top: 0});
}
addEventListener("hashchange", aller);

// Hors ligne (aperçu) : on montre la liste de cadeaux.js
function demo(){
  return { id: "demo", prenom: SEED ? SEED.prenom : "Oscar", demo: true, reservations: {},
    cadeaux: (SEED ? SEED.cadeaux : []).map(c => ({...c, id: slug(c.nom)})) };
}

/* ---------- Affichage ---------- */
/* ---------- Thèmes ---------- */
const FONDS = {
  sapin:    { nom: "Sapin",    couleurs: ["#123a2f", "#0a231c"] },
  polaire:  { nom: "Polaire",  couleurs: ["#1d3a66", "#0b1a33"] },
  bordeaux: { nom: "Bordeaux", couleurs: ["#5a1422", "#2a0a10"] },
  chocolat: { nom: "Chocolat", couleurs: ["#4a2e1e", "#24160f"] },
  galaxie:  { nom: "Galaxie",  couleurs: ["#3a1f6b", "#140b2a"] },
};
const STYLES_LISTE = {
  course: { nom: "Course",       apercu: "#e0313f" },
  dore:   { nom: "Doré",         apercu: "linear-gradient(180deg,#f7d57a,#c8952f)" },
  sucre:  { nom: "Sucre d'orge", apercu: "repeating-linear-gradient(-45deg,#e0313f 0 8px,#fff 8px 16px)" },
  glace:  { nom: "Glace",        apercu: "linear-gradient(180deg,#7fd0ff,#2f7fd6)" },
  foret:  { nom: "Forêt",        apercu: "linear-gradient(180deg,#2f8a5f,#165a3b)" },
};
// Sur une liste : le thème de son propriétaire. Ailleurs : le sien si on est connecté.
function appliquerTheme(){
  const t = ((vue === "liste" || vue === "ma-liste") && liste && liste.theme) || (session && session.profil.theme) || {};
  document.body.dataset.fond = FONDS[t.fond] ? t.fond : "sapin";
  document.body.dataset.liste = STYLES_LISTE[t.liste] ? t.liste : "course";
}

function render(){
  appliquerTheme();
  renderNav();
  const main = $("#main"); main.innerHTML = "";
  ({bienvenue: vueBienvenue, accueil: vueAccueil, liste: vueListe, connexion: vueConnexion, inscription: vueInscription, "ma-liste": vueMaListe})[vue](main);
}

function renderNav(){
  const n = $("#nav"); n.innerHTML = "";
  n.append(lien("#accueil", "brand", "🎄 Noël en famille"));
  const d = el("div", "nav-droite");
  if (session){
    const s = el("span", "statut"); s.append("Connecté : ", el("b", null, joli(session.profil.prenom))); d.append(s);
    if (estAdmin()) d.append(el("span", "admin-badge", "🛡️ Admin"));
    d.append(lien("#accueil", "btn ghost small", "Toutes les listes"));
    d.append(lien("#ma-liste", "btn small", "Ma liste"));
    d.append(bouton("btn deco small", "🚪 Se déconnecter", deconnecter));
  } else if (invite){
    const s = el("span", "statut"); s.append("👀 ", el("b", null, "Mode invité")); d.append(s);
    d.append(lien("#accueil", "btn ghost small", "Toutes les listes"));
    d.append(bouton("btn ghost small", "Quitter", () => { choisirInvite(false); location.hash = "accueil"; aller(); }));
  }
  n.append(d);
}

function deconnecter(){ ecrireSession(null); choisirInvite(false); location.hash = "accueil"; aller(); }

// Écran d'entrée : se connecter, créer sa liste, ou entrer en invité
function vueBienvenue(main){
  entete("Noël en famille", "Bienvenue ! Les frères et sœurs se connectent pour gérer leur liste. Tous les autres entrent en invité pour regarder les listes et réserver un cadeau.");
  tableau([]);
  const g = el("div", "choix");
  const carte = (icone, titre, texte, action) => {
    const b = el("button", "choix-carte"); b.type = "button";
    b.append(el("span", "choix-i", icone), el("span", "choix-t", titre), el("span", "choix-d", texte));
    b.onclick = action; return b;
  };
  g.append(carte("👀", "Mode invité", "Regarder les listes et réserver un cadeau. Pas besoin de mot de passe.", () => {
    choisirInvite(true);
    if (vueApres){ const h = vueApres; vueApres = null; if (location.hash === "#" + h) aller(); else location.hash = h; }
    else if (location.hash === "#accueil") aller(); else location.hash = "accueil";
  }));
  g.append(carte("🔐", "Se connecter", "Tu as déjà ta liste ? Entre ton prénom et ton mot de passe.", () => { location.hash = "connexion"; }));
  g.append(carte("✨", "Créer ma liste", "Première fois ? Crée ton profil pour faire ta liste de Noël.", () => { location.hash = "inscription"; }));
  main.append(g);
}

function entete(titre, texte){
  $("#title").textContent = titre;
  document.title = titre;
  $("#message").textContent = texte;
}

function hors_ligne(main){
  main.append(el("p", "info-bandeau", "Le site n'est pas encore relié à son serveur. Les profils et les réservations marcheront une fois le site en ligne sur Netlify."));
}

function vueAccueil(main){
  entete("Les listes de Noël", "Choisis une liste pour voir les idées de cadeaux. Pas besoin de compte pour regarder et réserver : tu es en mode invité.");
  const nbCadeaux = listes.reduce((s, l) => s + l.nb, 0);
  tableau([["Listes", chargement ? "…" : String(listes.length)], ["Cadeaux", chargement ? "…" : String(nbCadeaux)]]);
  const bar = el("div", "bar"), t = el("div");
  t.append(el("h2", null, "Qui fait sa liste ?"), el("p", null, "Une liste par frère et sœur."));
  bar.append(t); main.append(bar);
  if (chargement) return main.append(el("p", "aide", "Chargement des listes…"));
  if (enLigne === false){
    hors_ligne(main);
    const g = el("div", "profils"); g.append(carteProfil({id: "demo", prenom: demo().prenom, nb: demo().cadeaux.length}));
    return main.append(g);
  }
  if (!listes.length){
    const v = el("div", "empty");
    v.append(el("strong", null, "Aucune liste pour l'instant"), "Clique sur « Créer ma liste » en haut pour faire la première.");
    return main.append(v);
  }
  const g = el("div", "profils");
  listes.forEach(l => g.append(carteProfil(l)));
  main.append(g);
}
function carteProfil(l){
  const a = lien("#liste-" + l.id, "profil" + (session && session.profil.id === l.id ? " moi" : "") +
    (l.theme && STYLES_LISTE[l.theme.liste] ? " liste-" + l.theme.liste : ""));
  a.append(el("span", "nb", session && session.profil.id === l.id ? "Ma liste" : "Liste de Noël"),
    el("span", "nom", l.prenom), el("span", "nb", l.nb + (l.nb > 1 ? " cadeaux" : " cadeau")), el("span", "voir", "Voir la liste →"));
  return a;
}

function trier(cadeaux){ return [...cadeaux].sort((a, b) => (b.prix ?? -1) - (a.prix ?? -1)); }

function vueListe(main){
  main.append(lien("#accueil", "retour", "← Toutes les listes"));
  if (chargement){ entete("Chargement…", ""); tableau([["Cadeaux", "…"], ["Total env.", "…"]]); return; }
  if (!liste){
    entete("Liste introuvable", enLigne === false ? "" : "Cette liste n'existe pas, ou a changé de nom.");
    tableau([["Cadeaux", "—"], ["Total env.", "—"]]);
    if (enLigne === false) hors_ligne(main);
    return;
  }
  const proprio = session && session.profil.id === liste.id;
  entete("La liste " + de(liste.prenom), proprio
    ? "C'est ta liste. Les réservations sont cachées pour te garder la surprise."
    : "Clique sur « Je l'offre » pour réserver un cadeau : les autres verront qu'il est déjà pris.");
  const total = liste.cadeaux.reduce((s, c) => s + (+c.prix || 0), 0);
  tableau([["Cadeaux", String(liste.cadeaux.length)], ["Total env.", total ? Math.round(total).toLocaleString("fr-FR") + " €" : "—"]]);
  if (liste.demo) hors_ligne(main);
  const bar = el("div", "bar"), t = el("div");
  t.append(el("h2", null, "Grille de départ"), el("p", null, "Du plus cher au moins cher."));
  bar.append(t);
  if (proprio) bar.append(lien("#ma-liste", "btn", "✏️ Modifier ma liste"));
  main.append(bar);
  if (estAdmin() && !proprio && !liste.demo) main.append(outilsAdmin());
  const ol = el("ol", "grid");
  if (!liste.cadeaux.length){
    const li = el("li", "empty");
    li.append(el("strong", null, "Pas encore d'idées"), proprio ? "Ajoute tes premiers cadeaux dans « Ma liste »." : liste.prenom + " n'a encore rien ajouté. Repasse bientôt !");
    ol.append(li);
  }
  trier(liste.cadeaux).forEach((c, i) => ol.append(carteCadeau(c, i, proprio ? null : zoneResa(c))));
  main.append(ol);
}

// Boîte à outils de l'admin, sur la liste de quelqu'un d'autre
function outilsAdmin(){
  const box = el("div", "admin-box");
  const tete = el("div", "admin-tete");
  tete.append(el("span", "admin-badge", "🛡️ Admin"), el("span", null, "Tu peux gérer la liste " + de(liste.prenom) + "."));
  box.append(tete);
  const act = el("div", "actions");
  act.append(lien("#modifier-" + liste.id, "btn small", "✏️ Modifier cette liste"));
  act.append(bouton("btn ghost small", "🔑 Donner un nouveau code", () => { adminAction = adminAction === "code" ? null : "code"; render(); }));
  act.append(bouton("btn deco small", "🗑️ Supprimer cette liste", () => { adminAction = adminAction === "supprimer" ? null : "supprimer"; render(); }));
  box.append(act);

  if (adminAction === "code"){
    const f = el("form", "admin-form"); f.noValidate = true;
    f.append(champ("a-code", "Nouveau code pour " + liste.prenom + " (4 chiffres)", "password", {inputMode: "numeric", pattern: "[0-9]*", maxLength: 8, autocomplete: "new-password"}));
    const a = el("div", "actions");
    const ok = el("button", "btn small", "Enregistrer le code"); ok.type = "submit";
    a.append(ok, bouton("btn ghost small", "Annuler", () => { adminAction = null; render(); }));
    f.append(a);
    f.onsubmit = async e => {
      e.preventDefault();
      const code = $("#a-code").value;
      if (code.length < 4) return alerter(f, "Le code doit faire au moins 4 chiffres.");
      ok.disabled = true;
      try{
        await api("listes/" + liste.id + "/code", {method: "POST", body: {motdepasse: code}, auth: true});
        adminAction = null; render();
        $(".admin-box").append(el("p", "aide", "C'est fait : dis à " + liste.prenom + " son nouveau code."));
      }catch(err){ alerter(f, err.status ? err.message : "Le site n'arrive pas à joindre son serveur."); ok.disabled = false; }
    };
    box.append(f);
  }
  if (adminAction === "supprimer"){
    const z = el("div", "admin-form");
    z.append(el("p", "alerte", "Supprimer la liste " + de(liste.prenom) + " ? Son profil, ses cadeaux et ses réservations seront effacés pour de bon."));
    const a = el("div", "actions");
    const oui = bouton("btn deco small", "Oui, supprimer pour de bon", async () => {
      oui.disabled = true;
      try{ await api("listes/" + liste.id, {method: "DELETE", auth: true}); adminAction = null; location.hash = "accueil"; }
      catch(err){ z.append(el("p", "alerte", err.status ? err.message : "Le site n'arrive pas à joindre son serveur.")); oui.disabled = false; }
    });
    a.append(oui, bouton("btn ghost small", "Annuler", () => { adminAction = null; render(); }));
    z.append(a);
    box.append(z);
  }
  return box;
}

// Les précisions "Taille 46", "Couleur noir, pointure 45"… deviennent des étiquettes ; le reste reste une phrase.
function decouper(precisions){
  const chips = [], phrases = [];
  for (const part of (precisions || "").split(/,\s*/)){
    const p = part.trim(); if (!p) continue;
    if (/^(taille|pointure|couleur)\b/i.test(p) && p.length < 28) chips.push(p);
    else phrases.push(p);
  }
  return { chips, note: phrases.join(", ") };
}

function carteCadeau(c, i, extra){
  const li = el("li", "slot" + (liste.reservations && liste.reservations[c.id] ? " taken" : ""));
  const pos = el("div", "pos"); pos.append(el("small", null, "Pos."), "P" + (i + 1)); li.append(pos);
  const info = el("div", "info");
  info.append(el("h3", null, c.nom));
  const { chips, note } = decouper(c.precisions);
  if (chips.length){ const s = el("div", "specs"); chips.forEach(t => s.append(el("span", "chip", t))); info.append(s); }
  if (note) info.append(el("p", "note", note));
  if (extra) info.append(extra);
  li.append(info);
  const side = el("div", "side");
  if (+c.prix){
    const p = el("div", "price");
    if (c.prixEstime) p.append(el("span", "approx", "env."));
    p.append(euro(+c.prix)); side.append(p);
  } else side.append(el("div", "price none", "Prix à voir"));
  const u = c.lien && safeUrl(c.lien);
  if (u){
    const a = el("a", "go-btn"); a.href = u.href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.append("Voir ", el("span", "host", u.hostname.replace(/^www\./, "")), " ↗"); side.append(a);
    const copier = bouton("copier-btn", "📋 Copier le lien", async () => {
      let ok = false;
      try{ await navigator.clipboard.writeText(u.href); ok = true; }
      catch{
        // Navigateur qui refuse : on copie à l'ancienne
        const t = document.createElement("textarea"); t.value = u.href; document.body.append(t); t.select();
        try{ ok = document.execCommand("copy"); }catch{}
        t.remove();
      }
      copier.textContent = ok ? "✅ Lien copié !" : "Copie impossible";
      setTimeout(() => { copier.textContent = "📋 Copier le lien"; }, 2000);
    });
    side.append(copier);
  }
  li.append(side);
  return li;
}

/* ---------- Réservation ---------- */
function confettis(z){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const couleurs = ["#e0313f", "#f2c35b", "#2fa35a", "#62d4ff", "#ffffff"];
  for (let i = 0; i < 18; i++){
    const p = el("span", "confetti");
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70;
    p.style.background = couleurs[i % couleurs.length];
    p.style.setProperty("--dx", Math.cos(a) * d + "px");
    p.style.setProperty("--dy", Math.sin(a) * d - 30 + "px");
    p.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    z.append(p); setTimeout(() => p.remove(), 1000);
  }
}

// Enlève les morceaux de suivi des liens (« ?ref=…&utm_… ») pour garder une adresse courte qui marche
function nettoyerLien(lien){
  const u = safeUrl(lien); if (!u) return lien;
  [...u.searchParams.keys()].forEach(k => { if (/^(utm_|ref|tag|srsltid|gclid|fbclid|psc|pd_rd|pf_rd|qid|sr|keywords|crid|sprefix|dib|th|_encoding|content-id|smid|spla)/i.test(k)) u.searchParams.delete(k); });
  if (/amazon\./.test(u.hostname)){ const m = u.pathname.match(/\/dp\/[A-Z0-9]{10}/); if (m) return u.origin + m[0]; }
  const propre = u.toString();
  return propre.length > 480 ? u.origin + u.pathname + u.hash : propre;
}
// « 1 299,99 € » → 1299.99
function lirePrix(t){
  let s = String(t || "").replace(/[^\d.,]/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
}

// Beaucoup de boutiques bloquent la lecture de leurs pages. Mais l'adresse elle-même contient
// souvent le nom du produit et sa couleur : « …/noir_et_argent-sneakers_homme_initiator-nike-p-IB45950DSL/ »
const COULEURS = "noir|noire|blanc|blanche|rouge|bleu|bleue|vert|verte|gris|grise|rose|jaune|orange|violet|violette|marron|beige|argent|or|dore|kaki|marine|bordeaux|creme|turquoise|multicolore";
function lireAdresse(lien){
  const u = safeUrl(lien); if (!u) return {};
  const morceaux = decodeURIComponent(u.pathname).split("/").filter(Boolean)
    .map(m => m.replace(/\.(html?|aspx?|php)$/i, "")
      .replace(/[-_]p0?\d{5,}$/i, "")            // Zara : -p01437329
      .replace(/-p-[a-z0-9]+$/i, "")             // Intersport : -p-IB45950DSL
      .replace(/_[a-z]+fr$/i, "")                // JD Sports : _jdsportsfr
      .replace(/^f-\d+-.*$/i, ""))               // Cdiscount : f-12083-lego60510
    .filter(m => /[a-zà-ÿ]{3,}[-_][a-zà-ÿ]{2,}/i.test(m) && !/^(fr|fr-fr|homme|femme|enfant|juniors?|search|resultats?|categor)/i.test(m));
  const morceau = morceaux.sort((a, b) => b.length - a.length)[0];
  const r = {};
  // Itaka et d'autres : « #/172-couleur-noir/349-taille-l »
  for (const m of u.hash.split("/")){
    const x = m.match(/^\d+-([a-z]+)-(.+)$/i); if (!x) continue;
    const v = decodeURIComponent(x[2]).replace(/[-_]/g, " ");
    if (/^(couleur|color|coloris)$/i.test(x[1])) r.couleur = v;
    if (/^(taille|size|pointure)$/i.test(x[1])) r.taille = /^[a-z]{1,4}$/i.test(v) ? v.toUpperCase() : v;
  }
  if (morceau){
    const texte = morceau.replace(/[-_+]+/g, " ").replace(/\s+/g, " ").trim();
    r.nom = texte.charAt(0).toUpperCase() + texte.slice(1);
    const c = texte.toLowerCase().match(new RegExp("\\b(" + COULEURS + ")(?: et (" + COULEURS + "))?\\b"));
    if (c && !r.couleur) r.couleur = c[0];
  }
  return r;
}
// Un « nom » qui n'est que le nom de la boutique, ou une page anti-robot, ne sert à rien
function nomUtile(nom, lien){
  if (!nom) return null;
  const site = (safeUrl(lien)?.hostname || "").replace(/^www\./, "").split(".")[0];
  const n = nom.toLowerCase().replace(/\.(fr|com)$/, "").trim();
  if (n === site || n.length < 4 || /robot|captcha|access denied|accès refusé|just a moment|attention required|vérification/i.test(nom)) return null;
  return nom;
}

/* ---------- Le bouton magique ----------
   Un favori à mettre dans la barre du navigateur. Sur la page d'un produit (n'importe quel site),
   on clique dessus : il lit la page affichée dans TON navigateur (nom, prix, taille et couleur choisies)
   et ouvre « Ma liste » avec tout déjà rempli. Cette fonction est copiée telle quelle dans le favori :
   elle ne doit rien utiliser d'autre que ce qu'elle contient. */
function boutonMagique(APP, lire){
  const d = document, tous = s => [...d.querySelectorAll(s)];
  const texte = e => (e ? (e.getAttribute("content") || e.getAttribute("aria-label") || e.getAttribute("title") || e.value || e.textContent || "") : "").replace(/\s+/g, " ").trim();
  let nom = "", prix = "", couleur = "", taille = "";

  // 1. Les données « produit » que les boutiques mettent pour Google
  const parcours = o => {
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o)) return o.forEach(parcours);
    if (/Product/i.test([].concat(o["@type"] || []).join(" "))){
      nom = nom || o.name || "";
      couleur = couleur || (typeof o.color === "string" ? o.color : "");
      // (pas la taille d'ici : ces données listent souvent toutes les tailles du produit, pas celle choisie)
      const off = [].concat(o.offers || [])[0];
      if (off){ const p = off.price || off.lowPrice || (off.priceSpecification || {}).price; if (p && !prix) prix = String(p); }
    }
    Object.values(o).forEach(parcours);
  };
  tous('script[type="application/ld+json"]').forEach(s => { try{ parcours(JSON.parse(s.textContent)); }catch(e){} });

  // 2. Les balises meta, puis le prix affiché sur la page
  const meta = n => texte(d.querySelector('meta[property="' + n + '"],meta[name="' + n + '"]'));
  nom = nom || meta("og:title") || texte(d.querySelector("h1")) || d.title;
  // Le prix, en essayant de plus en plus de cachettes, de la plus sûre à la moins sûre
  const twitter = meta("twitter:data1");
  prix = prix || meta("product:price:amount") || meta("og:price:amount") || (/€|EUR/i.test(twitter) ? twitter.replace(/[^\d,.\s]/g, "") : "")
    || texte(d.querySelector('[itemprop="price"]'));
  // Attributs que posent beaucoup de boutiques (Magento, PrestaShop, WooCommerce…)
  if (!prix){
    const a = d.querySelector("[data-price-amount],[data-price],[data-product-price],[data-final-price]");
    if (a) prix = a.getAttribute("data-price-amount") || a.getAttribute("data-price") || a.getAttribute("data-product-price") || a.getAttribute("data-final-price") || "";
    if (prix && !/\d/.test(prix)) prix = "";
  }
  // Boutiques Shopify : le prix est rangé dans la page, en centimes
  if (!prix){
    try{ const v = window.ShopifyAnalytics.meta.product.variants[0].price; if (v) prix = String(v / 100); }catch(e){}
  }
  // Amazon
  if (!prix){
    const e = d.querySelector("#corePrice_feature_div .a-offscreen, #corePriceDisplay_desktop_feature_div .a-offscreen, .a-price .a-offscreen");
    if (e) prix = e.textContent;
  }
  // Le prix affiché à l'écran, sous le titre du produit (en ignorant les anciens prix barrés).
  // Marche aussi quand les centimes sont à part : « 44<sup>,99</sup> € »
  if (!prix){
    const barre = x => x.closest("del,s,strike,[class*='old' i],[class*='was' i],[class*='barr' i],[class*='strike' i],[class*='crossed' i],[class*='before' i],[class*='regular' i],[class*='compare' i]");
    const titre = d.querySelector("h1");
    const motif = /^(?:€|EUR)?\s*(\d{1,5}(?:[ .]\d{3})*(?:[,.]\d{1,2})?)\s*(?:€|EUR|TTC|\s)*$/i;
    let trouve = null;
    for (const x of tous("body *")){
      if (!x.offsetParent || /^(SCRIPT|STYLE|OPTION|SELECT|INPUT|BUTTON|A|NAV|HEADER|FOOTER)$/.test(x.tagName) || barre(x)) continue;
      if (titre && (titre.compareDocumentPosition(x) & 2)) continue; // avant le titre : menus, bandeaux…
      let t = (x.innerText || "").replace(/ /g, " ").replace(/\s*([,.])\s*/g, "$1").replace(/\s+/g, " ").trim();
      if (!t || t.length > 22 || !/€|EUR/i.test(t)) continue;
      const sup = x.querySelector("sup");
      if (sup && !/[,.]/.test(t)){ const c = sup.textContent.trim(); t = t.replace(c, "," + c); }
      const m = t.match(motif);
      if (!m) continue;
      const p = { valeur: m[1], prixDansClasse: /price|prix|amount|montant/i.test(String(x.className && x.className.baseVal !== undefined ? x.className.baseVal : x.className) + " " + (x.id || "")) };
      if (!trouve || (p.prixDansClasse && !trouve.prixDansClasse)) trouve = p;
      if (trouve.prixDansClasse) break;
    }
    if (trouve) prix = trouve.valeur;
  }
  // Ancien essai, plus large : un élément « price » qui contient un nombre et des €
  if (!prix){
    const e = tous('[class*="price" i],[data-testid*="price" i],[id*="price" i]').find(x => /\d[\d\s.]*[,.]?\d*\s*€|€\s*\d/.test(x.textContent) && x.textContent.length < 60);
    const m = e && e.textContent.replace(/ /g, " ").match(/\d[\d\s.]*(?:[,.]\d{1,2})?/);
    if (m) prix = m[0];
  }

  // 3. La taille et la couleur que tu as choisies sur la page
  const zones = { taille: /taille|size|pointure|tama/i, couleur: /couleur|colou?r|coloris/i };
  // Une vraie taille ou couleur : courte, sans code produit (pas « 12,B094WLFGD3 »)
  const correct = v => v && v.length < 30 && !/(?=[A-Z0-9]*\d)[A-Z0-9]{7,}|,/.test(v) && !/^\d{3,}$/.test(v);
  const choisi = re => {
    // a) Amazon : « Taille : M », « Couleur : Midnight Black »
    const amazon = texte(d.querySelector(re === zones.taille ? "#variation_size_name .selection, #inline-twister-expanded-dimension-text-size_name" : "#variation_color_name .selection, #inline-twister-expanded-dimension-text-color_name"));
    if (correct(amazon)) return amazon;
    // b) une liste déroulante « Taille »
    for (const s of tous("select")){
      const etiquette = (s.name || "") + " " + (s.id || "") + " " + (s.getAttribute("aria-label") || "") + " " + texte(s.labels && s.labels[0]);
      if (re.test(etiquette) && s.selectedIndex > 0 && correct(texte(s.options[s.selectedIndex]))) return texte(s.options[s.selectedIndex]);
    }
    // c) un bouton coché / sélectionné dans une zone « taille » ou « couleur »
    for (const e of tous('[aria-checked="true"],[aria-pressed="true"],[aria-selected="true"],input:checked,[class*="selected" i],[class*="is-active" i]')){
      // « unselected », « not-selected »… veulent dire le contraire
      if (/(un|not|non|de)-?selected/i.test(String(e.className && e.className.baseVal !== undefined ? e.className.baseVal : e.className))) continue;
      const zone = e.closest('[class*="size" i],[class*="taille" i],[class*="color" i],[class*="couleur" i],[id*="size" i],[id*="color" i],[data-testid*="size" i],[data-testid*="color" i],fieldset,[role="radiogroup"]');
      if (!zone) continue;
      const nomZone = (zone.className || "") + " " + (zone.id || "") + " " + (zone.getAttribute("data-testid") || "") + " " + (zone.getAttribute("aria-label") || "") + " " + texte(zone.querySelector("legend,label"));
      if (!re.test(nomZone)) continue;
      const v = e.matches("input") ? (texte(e.labels && e.labels[0]) || e.value) : texte(e);
      if (correct(v)) return v;
    }
    return "";
  };
  // Dernier essai : « Couleur : Midnight Black » écrit dans le titre de la page (Amazon)
  const dansTitre = re => { const m = d.title.match(new RegExp("(?:" + re.source + ")\\s*:\\s*([^,:|]{1,30})", "i")); return m && correct(m[1].trim()) ? m[1].trim() : ""; };
  taille = choisi(zones.taille) || taille || dansTitre(zones.taille);
  couleur = choisi(zones.couleur) || couleur || dansTitre(zones.couleur);
  // Les noms très longs (Amazon) : on garde le début, jusqu'à la première virgule
  if (nom.length > 70){ const coupe = nom.slice(25).search(/,| - /); if (coupe >= 0) nom = nom.slice(0, 25 + coupe); }

  // « Noir/Dark Smoke Grey/Smoke Grey » → « Noir »
  couleur = couleur.split("/")[0].trim();
  const infos = { lien: location.href, nom: nom.slice(0, 120), prix: String(prix).trim(), couleur: couleur.slice(0, 40), taille: taille.slice(0, 20) };
  if (lire) return infos;
  window.open(APP + "/#ajout?" + new URLSearchParams(infos), "_blank");
}
function lienBoutonMagique(){
  return "javascript:" + encodeURIComponent("(" + boutonMagique.toString() + ")(" + JSON.stringify(location.origin) + ")");
}

// Le nom du cadeau, juste l'essentiel : sans la couleur, sans la description après la virgule.
// « Veste de ski et snowboard chaude et imperméable homme, 100 noir » → « Veste de ski et snowboard chaude et imperméable homme »
const COULEURS_NOM = COULEURS.replace(/\|or\|/, "|") + "|dorée|argenté|argentée|écru|anthracite|camel|blanc cassé|bleu marine|bleu nuit";
function nomEssentiel(nom){
  let n = String(nom || "").replace(/\s+/g, " ").trim();
  // On garde le début, mais au moins 3 mots (« Playstation Sony, Manette 5… » → « Playstation Sony Manette 5 Officielle DualSense »)
  const morceaux = n.split(/\s[:|–]\s|\s-\s|,\s/).map(m => m.trim()).filter(Boolean);
  let debut = morceaux[0] || "", i = 1;
  while (debut.split(" ").length < 3 && i < morceaux.length) debut += " " + morceaux[i++];
  if (debut.length >= 6) n = debut;
  n = n.replace(new RegExp("\\b(" + COULEURS_NOM + ")(\\s+(et|/)\\s+(" + COULEURS_NOM + "))*\\b", "gi"), " ")
    .replace(/\s+/g, " ").replace(/^[\s,/-]+|[\s,/-]+$/g, "").trim();
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : String(nom || "").trim();
}

// Ce que le site a rempli tout seul : si on change de lien, on peut le remplacer sans toucher à ce que tu as écrit toi-même
let autoRempli = {};
function mettreAuto(id, valeur){
  const e = $("#" + id); if (!e) return false;
  const actuel = e.value.trim();
  if (actuel && actuel !== String(autoRempli[id] ?? "")) return false; // tu l'as écrit toi-même : on n'y touche pas
  e.value = valeur; autoRempli[id] = e.value.trim();
  return true;
}

// Quand on colle un lien : le serveur lit la page du produit, et on remplit les cases encore vides
let dernierLienLu = "";
async function remplirDepuisLien(){
  const champ = $("#g-lien"), info = $("#g-info-lien");
  if (!champ || !info) return;
  const lienP = champ.value.trim();
  if (!safeUrl(lienP) || lienP === dernierLienLu) return;
  dernierLienLu = lienP;
  // Nouveau lien : ce qui avait été rempli tout seul pour l'ancien lien est effacé (pas ce que tu as écrit toi-même)
  for (const [id, v] of Object.entries(autoRempli)){ const e = $("#" + id); if (e && e.value.trim() === v) e.value = ""; }
  autoRempli = {};
  info.textContent = "🔎 Je cherche le prix, la taille et la couleur…";
  let r = {};
  try{ r = await api("apercu", {method: "POST", body: {lien: lienP}, auth: true}); }
  catch(e){ if (e.status === 401) { info.textContent = e.message; return; } }
  if ($("#g-lien") !== champ || champ.value.trim() !== lienP) return; // le formulaire a changé entre-temps
  // Ce que la page n'a pas donné, on le cherche dans l'adresse
  const adresse = lireAdresse(lienP);
  r.nom = nomUtile(r.nom, lienP) || adresse.nom;
  r.couleur = r.couleur || adresse.couleur;
  r.taille = r.taille || adresse.taille;
  const trouve = [];
  if (r.nom) r.nom = nomEssentiel(r.nom);
  if (r.taille && /^[a-z]{1,4}$/i.test(r.taille)) r.taille = r.taille.toUpperCase();
  if (r.nom && mettreAuto("g-nom", r.nom)) trouve.push("le nom");
  if (r.prix && mettreAuto("g-prix", r.prix)){ $("#g-estime").checked = false; trouve.push("le prix"); }
  const prec = $("#g-precisions"), ajouts = [];
  if (r.taille){ ajouts.push("Taille " + r.taille); trouve.push("la taille"); }
  if (r.couleur){ ajouts.push("Couleur " + r.couleur); trouve.push("la couleur"); }
  if (ajouts.length && !mettreAuto("g-precisions", ajouts.join(", "))){
    // Tu avais déjà écrit des précisions : on ajoute seulement ce qui manque
    const manquants = ajouts.filter(a => !new RegExp("^" + a.split(" ")[0], "i").test(prec.value) && !prec.value.toLowerCase().includes(a.split(" ")[0].toLowerCase()));
    if (manquants.length) prec.value = [...manquants, prec.value.trim()].filter(Boolean).join(", ");
  }
  const manque = [];
  if (!r.prix && !$("#g-prix").value) manque.push("le prix");
  // La taille n'existe pas pour tous les cadeaux (une lampe, un Lego…) : on le rappelle seulement pour les vêtements et chaussures
  if (!r.taille && !/taille|pointure/i.test(prec.value) && /sweat|veste|pull|pantalon|jean|chaussure|basket|sneaker|t shirt|tee|robe|manteau|blouson|combinaison|gant|maillot|short|jogg/i.test(r.nom || "")) manque.push("la taille");
  const et = l => l.join(", ").replace(/, ([^,]*)$/, " et $1");
  info.textContent = (trouve.length ? "✅ J'ai rempli " + et(trouve) + ". " : "")
    + (manque.length === 2 ? "✍️ Ce site ne donne ni le prix ni la taille : écris-les à la main."
      : manque.length ? "✍️ Ce site ne donne pas " + manque[0] + " : écris-" + (manque[0] === "la taille" ? "la" : "le") + " à la main."
      : "Vérifie, puis clique sur le bouton.");
}

}

async function changerTheme(theme){
  const avant = liste.theme;
  liste.theme = theme; msg = {}; render(); // on montre tout de suite le nouveau thème
  try{
    const r = await api("listes/" + cible + "/theme", {method: "PUT", body: theme, auth: true});
    liste.theme = r.theme;
    if (cible === session.profil.id) ecrireSession({...session, profil: {...session.profil, theme: r.theme}});
    msg = {theme: "Thème enregistré !"};
  }catch(e){
    if (!session){ location.hash = "connexion"; return; }
    liste.theme = avant;
    msg = {theme: e.status ? e.message : "Le site n'arrive pas à joindre son serveur.", err: true};
  }
  render();
}

// Enregistre toute la liste ; renvoie un message d'erreur, ou rien si c'est bon
async function sauver(cadeaux, texte){
  try{
    const r = await api("listes/" + cible + "/cadeaux", {method: "PUT", body: {cadeaux}, auth: true});
    liste.cadeaux = r.cadeaux; edition = null; aSupprimer = null; msg = {texte};

    if (!session){ location.hash = "connexion"; return; }

    msg = {texte: texteErreur};
    return texteErreur;
  }
}

/* ---------- Neige ---------- */
function neige(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#snow"), ctx = cv.getContext("2d");
  let w, h, flocons = [];
  function taille(){
    w = cv.width = innerWidth; h = cv.height = innerHeight;
    const n = Math.round(Math.min(140, w * h / 8000));
    flocons = Array.from({length:n}, () => ({x:Math.random()*w, y:Math.random()*h, r:.8+Math.random()*2.6, v:.35+Math.random()*1.1, d:Math.random()*6.3}));
  }
  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const f of flocons){
      f.y += f.v; f.d += .012; f.x += Math.sin(f.d) * .45;
      if (f.y > h + 5){ f.y = -5; f.x = Math.random() * w; }
      ctx.fillStyle = "rgba(247,244,238," + (.35 + f.r / 5) + ")";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", taille);
  taille(); frame();
}
